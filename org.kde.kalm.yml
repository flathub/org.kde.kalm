app-id: org.kde.kalm
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
command: kalm
copy-icon: true
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
cleanup:
  - /include
  - /lib/cmake
  - /lib/libexec
  - /mkspecs
  - /etc/xdg/*categories
  - /share/qlogging-categories5
modules:
  - name: kalm
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/release-service/26.08.3/src/kalm-26.08.3.tar.xz
        sha256: 0ce0d27288157e6e1aa36c9ae2b05e427111a7230cc5a64726d5d1f8ad59beb0
        x-checker-data:
          type: anitya
          project-id: 8763
          stable-only: true
          url-template: https://download.kde.org/stable/release-service/$version/src/kalm-$version.tar.xz
