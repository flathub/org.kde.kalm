app-id: org.kde.kalm
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
command: kalm
copy-icon: true
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
cleanup:
  - /include
  - /lib/cmake
  - /lib/libexec
  - /mkspecs
  - /etc/xdg/*categories
  - /share/qlogging-categories5
modules:
  - name: kalm
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/release-service/26.08.1/src/kalm-26.08.1.tar.xz
        sha256: e5789d2e45f685f504cc5eedf8f6e7667f15dcd2b586e6801ba4921a58b0c5da
        x-checker-data:
          type: anitya
          project-id: 8763
          stable-only: true
          url-template: https://download.kde.org/stable/release-service/$version/src/kalm-$version.tar.xz
